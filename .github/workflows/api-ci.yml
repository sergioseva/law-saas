name: api-ci

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lawsaas
          POSTGRES_USER: lawsaas
          POSTGRES_PASSWORD: lawsaas
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    env:
      SECRET_KEY: ci-secret
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: lawsaas.settings.dev
      POSTGRES_DB: lawsaas
      POSTGRES_USER: lawsaas
      POSTGRES_PASSWORD: lawsaas
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      MASTER_KEK: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.18"

      - name: Set up Python
        run: uv python install 3.12

      - name: Generate MASTER_KEK
        run: |
          echo "MASTER_KEK=$(uv run --with cryptography python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> $GITHUB_ENV

      - name: Sync deps
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: Typecheck (mypy) — non-blocking until Phase 2 fleshes out crm/
        run: uv run mypy . || true

      - name: Run tests
        run: uv run pytest

[project]
name = "lawsaas-api"
version = "0.0.0"
description = "Multi-tenant SaaS for law firms — Django + DRF backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "django-allauth>=64.0",
    "django-environ>=0.11",
    "django-ratelimit>=4.1",
    "django-cors-headers>=4.4",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
    "cryptography>=43.0",
    "boto3>=1.35",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "Pillow>=10.4",
    "python-json-logger>=2.0",
    "sentry-sdk[django]>=2.14",
    "gunicorn>=23.0",
    "resend>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "DJ", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "lawsaas.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lawsaas.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --cov=. --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]
